<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nine Lives Spirit Cats</title>
<meta name="description" content="Spiritual cat art prints by Mira, the Cat Keeper. Printable cat guardians for rest, comfort, protection and new beginnings, each with its own legend and ritual page.">
<meta property="og:title" content="Nine Lives Spirit Cats">
<meta property="og:description" content="Printable spiritual cat art: cats as quiet spirit guides, each with its own legend.">
<meta property="og:image" content="/img/03_nazar_guardian.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: night-sky storefront. Starfield hero with logo + featured guardian, two collections in a masonry grid, story, what's included, notes. */
:root{
  --bg:#f3f0f8; --surface:#ffffff; --ink:#1f1d36; --muted:#5d5878; --line:#dcd6ea;
  --night:#1b1c3a; --night-ink:#ece8f7; --night-muted:#c9c3e2; --lavender:#7a66bd; --gold:#9c7220; --gold-soft:#e7c983; --on-gold:#1b1c3a;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121327; --surface:#1c1d38; --ink:#ebe7f6; --muted:#a9a3c4; --line:#2e2f52;
  --night:#0b0c1d; --lavender:#ad9ce6; --gold:#e2bd6c; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0}
.hero .eyebrow{color:var(--gold-soft)}
a{color:inherit}

.hero{background:var(--night);color:var(--night-ink);position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;grid-column:1/-1}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:20px;letter-spacing:.02em}
.brand svg{width:40px;height:40px;flex:none}
.top nav{display:flex;gap:22px;font-size:14px;align-items:center}
.top nav a{text-decoration:none;opacity:.85}
.top nav a:hover,.top nav a:focus-visible{opacity:1;color:var(--gold-soft)}
.top nav a.shop{opacity:1;border:1px solid #4b4b7a;border-radius:999px;padding:6px 14px}
.hero h1{font-size:clamp(36px,6vw,62px);line-height:1.06;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--gold-soft)}
.hero p.lede{font-size:18px;color:var(--night-muted);max-width:46ch;margin:20px 0 28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font:600 15px var(--body);text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-gold{background:var(--gold-soft);color:var(--on-gold)}
.btn-ghost{border-color:#4b4b7a;color:var(--night-ink);background:transparent}
.btn:focus-visible,.card:focus-visible,.close:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.hero figure{margin:0;position:relative}
.hero figure img{display:block;border-radius:8px 8px 200px 200px;aspect-ratio:4/5;object-fit:cover;width:100%;box-shadow:0 30px 80px -20px #000a;background:#2a2b52}
.hero figcaption{position:absolute;left:-18px;bottom:28px;background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:10px;font-size:13px;max-width:240px;box-shadow:0 10px 30px -10px #0007}
.hero figcaption b{font-family:var(--display);font-weight:400;font-size:17px;display:block}

section{padding-block:72px}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(28px,4vw,40px);margin-top:6px}
.head p{color:var(--muted);max-width:52ch;margin:0}
.grid{columns:3 280px;column-gap:20px}
.grid .loading{color:var(--muted)}
.card{break-inside:avoid;margin:0 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:block;width:100%;text-align:left;padding:0;color:inherit;font:inherit;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px #2a1f5a88}
.card img{display:block;width:100%;height:auto;background:var(--line)}
.card .meta{padding:14px 16px 16px;display:grid;gap:4px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h3{font-size:20px;min-width:0}
.price{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .theme{font-size:13px;color:var(--muted)}
.num{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lavender);font-weight:600}

.band{background:var(--surface);border-block:1px solid var(--line)}
.incl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px;margin:0;padding:0;list-style:none}
.incl li{display:grid;gap:6px;align-content:start}
.incl b{font-family:var(--display);font-weight:400;font-size:20px}
.incl span{color:var(--muted);font-size:15px}
.incl .spec{font-size:12px;color:var(--lavender);font-variant-numeric:tabular-nums;letter-spacing:.04em;font-weight:600}

.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.story blockquote{margin:12px 0 0;font-family:var(--display);font-size:clamp(26px,3.4vw,36px);line-height:1.25}
.story .text{display:grid;gap:14px;max-width:62ch;min-width:0}
.story .text p{margin:0}
.sig{font-family:var(--display);font-size:20px;color:var(--gold)}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.facts div{display:grid}
.facts b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--lavender);font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}

.notes{font-size:14px;color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.notes h3{font-size:18px;color:var(--ink);margin-bottom:6px}
.notes p{margin:0}
footer{background:var(--night);color:var(--night-muted);padding-block:36px calc(36px + env(safe-area-inset-bottom,0px));font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer .soon{color:var(--gold-soft)}

dialog{border:none;border-radius:16px;padding:0;max-width:min(880px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 40px 100px -20px #000c}
dialog::backdrop{background:#0b0c1dcc}
.dlg{display:grid;grid-template-columns:1fr 1fr}
.dlg img{display:block;width:100%;height:100%;object-fit:cover;max-height:80vh;background:var(--line)}
.dlg .body{padding:28px;display:grid;gap:12px;align-content:start;min-width:0}
.dlg h3{font-size:28px}
.dlg p{margin:0}
.dlg .full{font-size:13px;color:var(--muted)}
.close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:none;background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;z-index:1}
.soon{font-size:13px;color:var(--muted)}

@media (max-width:820px){
  .hero .wrap,.story,.dlg{grid-template-columns:1fr}
  .top nav a:not(.shop){display:none}
  .hero figure{max-width:420px}
  .hero figcaption{left:12px}
  .dlg img{max-height:46vh}
  section{padding-block:56px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#e7c983" d="M17 40c-3 0-4-3-3-7 1-5 3-9 3-14l-2-7 5 4h6l5-4-2 7c0 5 2 9 3 14 1 4 0 7-3 7z"/><path d="M31 39c6 0 10-3 10-9" stroke="#e7c983" stroke-width="2" fill="none" stroke-linecap="round"/><g fill="#ece8f7"><circle cx="44" cy="26" r="1"/><circle cx="45" cy="21" r=".8"/><circle cx="43" cy="16" r="1"/><circle cx="40" cy="11" r=".8"/><circle cx="35" cy="7" r="1"/><circle cx="9" cy="8" r=".8"/><circle cx="5" cy="14" r="1"/><circle cx="4" cy="21" r=".8"/><circle cx="6" cy="28" r="1"/></g></svg>
        <span data-t="brand">Nine Lives Spirit Cats</span>
      </div>
      <nav aria-label="Sections"><a href="#guardians">Guardians</a><a href="#companions">Companions</a><a href="#included">What you get</a><a href="#mira">About Mira</a><a class="shop" id="shopLink" href="#" target="_blank" rel="noopener" hidden>Shop on Etsy</a></nav>
    </div>
    <div>
      <p class="eyebrow" data-t="heroEyebrow"></p>
      <h1><span data-t="heroTitle"></span> <em data-t="heroTitleEm"></em></h1>
      <p class="lede" data-t="heroLede"></p>
      <div class="cta">
        <a class="btn btn-gold" href="#guardians">See the collection</a>
        <a class="btn btn-ghost" href="#mira">Meet Mira</a>
      </div>
    </div>
    <figure id="featured" hidden>
      <img id="featImg" alt="">
      <figcaption><b id="featName"></b><span data-t="featuredCaption"></span></figcaption>
    </figure>
  </div>
</header>

<main>
  <section id="guardians">
    <div class="wrap">
      <div class="head">
        <div><p class="eyebrow" data-t="c1Eyebrow"></p><h2 data-t="c1Title"></h2></div>
        <p data-t="c1Text"></p>
      </div>
      <div class="grid" id="g-guardians"><p class="loading">Loading the collection…</p></div>
    </div>
  </section>

  <section id="companions" style="padding-top:0">
    <div class="wrap">
      <div class="head">
        <div><p class="eyebrow" data-t="c2Eyebrow"></p><h2 data-t="c2Title"></h2></div>
        <p data-t="c2Text"></p>
      </div>
      <div class="grid" id="g-companions"></div>
    </div>
  </section>

  <section id="included" class="band">
    <div class="wrap">
      <div class="head"><div><p class="eyebrow" data-t="inclEyebrow"></p><h2 data-t="inclTitle"></h2></div>
      <p data-t="inclText"></p></div>
      <ul class="incl" id="incl"></ul>
    </div>
  </section>

  <section id="mira">
    <div class="wrap story">
      <div>
        <p class="eyebrow" data-t="aboutEyebrow"></p>
        <blockquote data-t="aboutQuote"></blockquote>
        <div class="facts" id="facts"></div>
      </div>
      <div class="text" id="story"></div>
    </div>
  </section>

  <section class="band" style="padding-block:48px">
    <div class="wrap notes" id="notes"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-t="footer"></span>
    <span class="soon" id="footSoon" data-t="soon"></span>
    <a class="soon" id="footShop" href="#" target="_blank" rel="noopener" hidden>Visit our Etsy shop</a>
  </div>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title">
  <button class="close" id="dlg-close" type="button" aria-label="Close">×</button>
  <div class="dlg">
    <img id="dlg-img" alt="">
    <div class="body">
      <span class="num" id="dlg-num"></span>
      <h3 id="dlg-title"></h3>
      <span class="price" id="dlg-price"></span>
      <p id="dlg-legend"></p>
      <p class="full" id="dlg-full"></p>
      <div><a class="btn btn-gold" id="dlg-buy" href="#" target="_blank" rel="noopener" hidden>Buy on Etsy</a></div>
      <p class="soon" id="dlg-soon">Coming soon as an instant digital download on Etsy.</p>
    </div>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n || 0).toFixed(2);
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(S){
  const T = S.text || {};
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t] ?? ''; });
  const P = S.products || [];

  const shop = safeUrl(S.shopUrl);
  $('shopLink').hidden = $('footShop').hidden = !shop;
  $('footSoon').hidden = !!shop;
  if (shop) $('shopLink').href = $('footShop').href = shop;

  const f = P.find(p => p.featured) || P[0];
  if (f){ $('featured').hidden = false; $('featImg').src = f.img; $('featImg').alt = f.alt || f.name; $('featName').textContent = f.name; }

  for (const col of ['guardians', 'companions']){
    const g = $('g-' + col); g.replaceChildren();
    P.filter(p => (p.collection || 'companions') === col).forEach(p => {
      const b = el('button', 'card'); b.type = 'button';
      const img = el('img'); img.src = p.img; img.alt = p.alt || p.name; img.loading = 'lazy';
      const meta = el('div', 'meta'), row = el('div', 'row');
      row.append(el('h3', null, p.name), el('span', 'price', money(p.price)));
      meta.append(el('span', 'num', p.label || ''), row, el('span', 'theme', p.theme || ''));
      b.append(img, meta); b.addEventListener('click', () => openView(p));
      g.appendChild(b);
    });
  }

  $('incl').replaceChildren(...(T.incl || []).map(i => { const li = el('li'); li.append(el('span', 'spec', i.spec), el('b', null, i.title), el('span', null, i.text)); return li; }));
  $('facts').replaceChildren(...(T.facts || []).map(i => { const d = el('div'); d.append(el('b', null, i.v), el('span', null, i.l)); return d; }));
  $('story').replaceChildren(...(T.story || []).map(t => el('p', null, t)), el('p', 'sig', T.signature || ''));
  $('notes').replaceChildren(...(T.notes || []).map(n => { const d = el('div'); d.append(el('h3', null, n.t), el('p', null, n.p)); return d; }));
}

function openView(p){
  $('dlg-img').src = p.img; $('dlg-img').alt = p.alt || p.name;
  $('dlg-num').textContent = p.label || '';
  $('dlg-title').textContent = p.name;
  $('dlg-price').textContent = money(p.price) + ' · digital download';
  $('dlg-legend').textContent = p.legend || '';
  $('dlg-full').textContent = p.title || '';
  const buy = safeUrl(p.etsy);
  $('dlg-buy').hidden = !buy; if (buy) $('dlg-buy').href = buy;
  $('dlg-soon').hidden = !!buy;
  $('dlg').showModal();
}
$('dlg-close').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });

fetch('/site.json', { cache: 'no-cache' })
  .then(r => r.json()).then(render)
  .catch(() => { $('g-guardians').innerHTML = '<p class="loading">The collection could not be loaded. Please refresh the page.</p>'; });

/* starfield */
const c = $('sky'), x = c.getContext('2d'); let ST = [];
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){ const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1; c.width = r.width * dpr; c.height = r.height * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  ST = Array.from({ length: Math.round(r.width * r.height / 2600) }, () => ({ x: Math.random() * r.width, y: Math.random() * r.height, r: Math.random() * 1.2 + .2, p: Math.random() * 6.28, s: Math.random() * .02 + .004 })); }
function draw(){ const r = c.getBoundingClientRect(); x.clearRect(0, 0, r.width, r.height);
  for (const s of ST){ s.p += still ? 0 : s.s; x.globalAlpha = .35 + .45 * Math.abs(Math.sin(s.p)); x.fillStyle = '#ece8f7'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill(); }
  if (!still) requestAnimationFrame(draw); }
size(); draw(); addEventListener('resize', () => { size(); if (still) draw(); });
</script>
</body>
</html>
