media:
  input: img
  output: /img

content:
  - name: site
    label: Site (yazılar ve ürünler)
    type: file
    path: site.json
    format: json
    fields:
      - name: shopUrl
        label: Etsy mağaza linki
        description: Boş bırakırsan sitede "Etsy shop opening soon" yazar.
        type: string

      - name: products
        label: Ürünler
        description: Sırayı sürükleyerek değiştirebilirsin.
        type: object
        list: true
        fields:
          - name: name
            label: Ürün adı
            type: string
          - name: img
            label: Görsel
            type: image
          - name: collection
            label: Koleksiyon
            type: select
            options:
              values:
                - name: guardians
                  label: The Nine Lives Guardians
                - name: companions
                  label: Spirit Companions
          - name: label
            label: Üst etiket (ör. Guardian 3)
            type: string
          - name: theme
            label: Kısa tema
            type: string
          - name: intro
            label: Tanıtım cümlesi (kartta görünür)
            type: text
          - name: story
            label: Hikâye (kediye tıklayınca görünür; paragrafların arasında bir boş satır bırak)
            type: text
          - name: alt
            label: Görsel açıklaması
            type: string
          - name: etsy
            label: Bu ürünün Etsy linki
            type: string
          - name: featured
            label: Girişte büyük göster
            description: Yalnızca bir üründe işaretle.
            type: boolean

      - name: posts
        label: Haberler ve hikâyeler
        description: "'Yayında' işaretli olmayanlar sitede görünmez. Taslakları görmek için adresin sonuna ?preview ekle."
        type: object
        list: true
        fields:
          - name: title
            label: Başlık
            type: string
          - name: published
            label: Yayında
            type: boolean
          - name: type
            label: Tür
            type: select
            options:
              values:
                - name: story
                  label: Efsane / halk hikâyesi
                - name: "true"
                  label: Gerçek hikâye
                - name: news
                  label: Haber
          - name: date
            label: Tarih (YYYY-AA-GG)
            type: string
          - name: img
            label: Görsel
            type: image
          - name: credit
            label: Görselin kaynağı / telif notu
            type: string
          - name: gallery
            label: Yazının altındaki ek görseller
            type: object
            list: true
            fields:
              - { name: img, label: Görsel, type: image }
              - { name: caption, label: "Alt yazı ve kaynak", type: string }
          - name: excerpt
            label: Kısa özet (kartta görünür)
            type: text
          - name: body
            label: Yazının tamamı (paragrafların arasında bir boş satır bırak)
            type: text
          - name: source
            label: Kaynak notu
            type: string
          - name: slug
            label: Bağlantı adı (ör. the-cat-at-the-gate)
            type: string

      - name: text
        label: Sayfa yazıları
        type: object
        fields:
          - { name: brand, label: Marka adı, type: string }
          - { name: heroEyebrow, label: "Giriş: küçük üst yazı", type: string }
          - { name: heroTitle, label: "Giriş: başlık (beyaz kısım)", type: string }
          - { name: heroTitleEm, label: "Giriş: başlık (altın kısım)", type: string }
          - { name: heroLede, label: "Giriş: açıklama", type: text }
          - { name: featuredCaption, label: "Girişteki ürünün alt yazısı", type: string }
          - { name: c1Eyebrow, label: "1. koleksiyon: üst yazı", type: string }
          - { name: c1Title, label: "1. koleksiyon: başlık", type: string }
          - { name: c1Text, label: "1. koleksiyon: açıklama", type: text }
          - { name: c2Eyebrow, label: "2. koleksiyon: üst yazı", type: string }
          - { name: c2Title, label: "2. koleksiyon: başlık", type: string }
          - { name: c2Text, label: "2. koleksiyon: açıklama", type: text }
          - { name: inclEyebrow, label: "Neler alacaksın: üst yazı", type: string }
          - { name: inclTitle, label: "Neler alacaksın: başlık", type: string }
          - { name: inclText, label: "Neler alacaksın: açıklama", type: text }
          - name: incl
            label: Neler alacaksın maddeleri
            type: object
            list: true
            fields:
              - { name: spec, label: Ölçü / teknik bilgi, type: string }
              - { name: title, label: Başlık, type: string }
              - { name: text, label: Açıklama, type: text }
          - { name: aboutEyebrow, label: "Hakkımda: üst yazı", type: string }
          - { name: aboutQuote, label: "Hakkımda: alıntı", type: string }
          - name: facts
            label: Hakkımda sayıları
            type: object
            list: true
            fields:
              - { name: v, label: Sayı, type: string }
              - { name: l, label: Açıklama, type: string }
          - name: story
            label: Hikâye paragrafları
            type: text
            list: true
          - { name: signature, label: İmza, type: string }
          - name: notes
            label: Alttaki notlar
            type: object
            list: true
            fields:
              - { name: t, label: Başlık, type: string }
              - { name: p, label: Metin, type: text }
          - { name: postsEyebrow, label: "Haberler ve hikâyeler: üst yazı", type: string }
          - { name: postsTitle, label: "Haberler ve hikâyeler: başlık", type: string }
          - { name: postsText, label: "Haberler ve hikâyeler: açıklama", type: text }
          - { name: contactEyebrow, label: "Mesaj kutusu: üst yazı", type: string }
          - { name: contactTitle, label: "Mesaj kutusu: başlık", type: string }
          - { name: contactText, label: "Mesaj kutusu: açıklama", type: text }
          - { name: contactThanks, label: "Mesaj gönderilince çıkan teşekkür", type: text }
          - { name: footer, label: Altbilgi, type: string }
          - { name: soon, label: "Etsy linki yokken görünen yazı", type: string }
